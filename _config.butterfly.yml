# Butterfly 主题配置

# 导航菜单
menu:
  首页: / || fas fa-home
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  归档: /archives/ || fas fa-archive
  课程: /course/ || fas fa-graduation-cap
  AI资讯: https://news.aijvs.com || fas fa-newspaper
  AI导航: https://nav.aijvs.com/ || fas fa-compass
  关于: /about/ || fas fa-heart

# 网站图标
favicon: /img/favicon.svg

# 代码高亮主题
highlight_theme: mac

# 代码复制按钮
code_copy:
  enable: true

# 社交链接
social:
  fab fa-github: https://github.com/aijvs || Github
  fas fa-envelope: mailto:aijvscom@gmail.com || Email

# 头像
avatar:
  img: /img/friend_404.gif
  effect: false

# 侧边栏卡片（必须在 aside: 键下）
aside:
  card_author:
    enable: true
    description: AIJVS - 免费开源的深度学习和 AI 学习平台
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/aijvs

  card_announcement:
    enable: true
    content: 追踪AGI新应用，探寻AI真善美！帮助你把AI真正用起来

# 首页文章配置
index_post_content:
  method: 3
  length: 500

# 页面美化
beautify:
  enable: true
  field: post
  title-prefix-icon: '\f0c1'
  title-prefix-icon-color: '#F47456'

# 深色模式
darkmode:
  enable: true
  button: true
  autoChangeMode: time

# 搜索
search:
  enable: true
  path: search.xml
  field: post
  content: true

# 评论系统（giscus - 基于 GitHub Discussions，中文界面）
comments:
  use: Giscus
  text: true
  lazyload: true
  count: false

# giscus 配置
giscus:
  repo: aijvs/aijvs-blog
  repo_id: R_kgDOS83Juw
  category: General
  category_id: DIC_kwDOS83Ju84C_Uc_
  light_theme: light
  dark_theme: dark
  option:
    data-lang: zh-CN
    data-mapping: pathname
    data-strict: "0"
    data-reactions-enabled: "1"
    data-emit-metadata: "0"
    data-input-position: bottom

# 页脚
footer:
  owner:
    enable: true
    since: 2026
  custom_text: AIJVS - 让每个人都参与到 AI 学习中来！
  copyright: CC BY-NC-SA 4.0

# CDN
CDN:
  option: jsdelivr

# 自定义注入（SEO 结构化数据 + llms.txt 声明）
inject:
  head:
    - <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"AIJVS","alternateName":"AIJVS - 帮你把AI用起来","url":"https://aijvs.com","description":"追踪AGI新应用，探寻AI真善美！提供AI工具评测、应用教程、双周速递、深度学习课程，帮助你把AI真正用起来。","inLanguage":"zh-CN","potentialAction":{"@type":"SearchAction","target":"https://aijvs.com/search?q={search_term_string}","query-input":"required name=search_term_string"}}</script>
    - <link rel="alternate" type="application/rss+xml" title="AIJVS" href="/atom.xml">
